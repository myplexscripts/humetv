name: Import Plezy source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-plezy.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HumeTV
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Plezy source
        shell: bash
        run: |
          set -e
          git remote add plezy https://github.com/edde746/plezy.git
          git fetch plezy main
          git checkout plezy/main -- .
          rm -rf .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Plezy source as HumeTV baseline"
          git push origin HEAD:main
