name: HumeTV Android TV
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: humetv-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      HUMETV_PREVIEW_SIGNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: humetv-android-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Retain personal preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: humetv-personal-preview-signing-v1
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Check HumeTV assets
        run: python3 scripts/checks/check_humetv_assets.py
      - name: Analyse changed UI
        run: dart analyze lib/theme/mono_theme.dart lib/widgets/app_icon.dart lib/widgets/lucide_symbol_assets.dart lib/widgets/tv_browse_rail.dart lib/widgets/tv_spotlight_background.dart lib/widgets/side_navigation_rail.dart
      - name: Test TV navigation and presentation
        run: flutter test test/widgets/humetv_skin_test.dart test/widgets/tv_spotlight_scaffold_test.dart test/navigation/navigation_tabs_test.dart test/focus/focus_navigation_intent_test.dart
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' 'cmake;4.1.2'
      - name: Compile release APK for 32-bit and 64-bit Android TVs
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number $((1000 + GITHUB_RUN_NUMBER)) --dart-define=ENABLE_UPDATE_CHECK=false
      - name: Package APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/HumeTV-Android-TV.apk
          cp docs/ANDROID-TV.md dist/INSTALL.txt
          cd dist
          sha256sum HumeTV-Android-TV.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HumeTV-Android-TV
          path: dist/
          if-no-files-found: error
          retention-days: 90
